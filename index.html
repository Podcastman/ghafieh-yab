<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قافیه‌یاب فارسی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    padding: 30px 20px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 24px; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
  .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
  #wordInput {
    flex: 1;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-family: inherit;
    outline: none;
  }
  #wordInput:focus { border-color: #667eea; }
  #searchBtn {
    padding: 14px 24px;
    font-size: 16px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
  }
  #searchBtn:active { background: #5568d3; }
  #results { min-height: 100px; }
  .result-title { color: #667eea; font-size: 14px; margin-bottom: 12px; font-weight: bold; }
  .words-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .word-item {
    background: #f0f4ff;
    color: #444;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 15px;
    border: 1px solid #d8e0ff;
  }
  .no-result { text-align: center; color: #999; padding: 20px; font-size: 14px; }
  .loading { text-align: center; color: #667eea; padding: 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 قافیه‌یاب فارسی</h1>
  <p class="subtitle">قافیه‌های هم‌وزن برای کلمه‌ات</p>
  <div class="input-box">
    <input type="text" id="wordInput" placeholder="مثلاً: دل" autocomplete="off">
    <button id="searchBtn">بگرد</button>
  </div>
  <div id="results"></div>
</div>

<script>
// ============ متغیر جهانی لیست کلمات ============
let wordList = [];

// ============ بارگذاری لیست کلمات از فایل ============
async function loadWords() {
  try {
    const response = await fetch('words.txt');
    const text = await response.text();
    wordList = text.split('\n')
      .map(w => w.trim())
      .filter(w => w.length > 0);
    console.log('لیست کلمات بارگذاری شد: ' + wordList.length + ' کلمه');
  } catch (error) {
    console.error('خطا در بارگذاری لیست:', error);
    results.innerHTML = '<div class="no-result">خطا در بارگذاری لیست کلمات 😔</div>';
  }
}

// ============ توابع کمکی ============
function isVowel(ch) {
  return ['ا','آ','و','ی','ه','ء'].includes(ch);
}

function getLastSyllable(word) {
  if (word.length === 0) return "";
  if (word.length === 1) return word;
  
  const chars = word.split('');
  const last = chars[chars.length - 1];
  
  if (isVowel(last)) {
    return word.slice(-3);
  }
  
  const beforeLast = chars[chars.length - 2];
  
  if (word.length <= 2) return word;
  
  if (isVowel(beforeLast)) {
    return word.length <= 3 ? word : word.slice(-3);
  }
  
  return word.slice(-3);
}

// ============ قانون قافیه + وزن ============
function isRhyme(word1, word2) {
  if (word1 === word2) return false;
  
  // قانون 1: طول کلمه یکسان
  if (word1.length !== word2.length) return false;
  
  // قانون 2: آخرین هجا یکسان
  const syl1 = getLastSyllable(word1);
  const syl2 = getLastSyllable(word2);
  
  if (syl1 !== syl2) return false;
  
  return true;
}

// ============ تابع اصلی ============
function findRhymes(word) {
  word = word.trim();
  if (!word) return [];
  return wordList.filter(w => isRhyme(word, w));
}

// ============ نمایش نتایج ============
function showResults(word, matches) {
  if (matches.length === 0) {
    results.innerHTML = '<div class="no-result">قافیه هم‌وزنی پیدا نشد 😔</div>';
    return;
  }
  
  const html = `
    <div class="result-title">${matches.length} قافیه هم‌وزن برای «${word}»:</div>
    <div class="words-list">
      ${matches.map(m => `<span class="word-item">${m}</span>`).join('')}
    </div>
  `;
  results.innerHTML = html;
}

// ============ رویدادها ============
const input = document.getElementById('wordInput');
const btn = document.getElementById('searchBtn');
const results = document.getElementById('results');

btn.addEventListener('click', () => {
  const word = input.value.trim();
  if (!word) {
    results.innerHTML = '<div class="no-result">یه کلمه بنویس اول 🙂</div>';
    return;
  }
  const matches = findRhymes(word);
  showResults(word, matches);
});

input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') btn.click();
});

// ============ شروع: بارگذاری کلمات ============
loadWords();
</script>
</body>
</html>
