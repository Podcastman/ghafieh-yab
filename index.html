<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قافیه‌یاب فارسی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #14B8A6 0%, #0F766E 50%, #334155 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .container {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 28px;
    padding: 32px 22px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
  }
  h1 { text-align: center; color: #0F766E; margin-bottom: 8px; font-size: 26px; font-weight: 700; }
  .subtitle { text-align: center; color: #64748B; font-size: 13px; margin-bottom: 24px; }
  .tabs {
    display: flex;
    background: #F1F5F4;
    border-radius: 16px;
    padding: 5px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #64748B;
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }
  .tab.active {
    color: white;
    background: linear-gradient(135deg, #14B8A6, #0F766E);
    box-shadow: 0 4px 12px rgba(20, 184, 166, 0.4);
  }
  .input-box { display: flex; gap: 10px; margin-bottom: 24px; }
  #wordInput {
    flex: 1;
    padding: 16px 18px;
    font-size: 16px;
    border: 2px solid transparent;
    background: #F1F5F4;
    border-radius: 16px;
    font-family: inherit;
    outline: none;
    color: #1E293B;
    font-weight: 500;
  }
  #wordInput:focus {
    background: white;
    border-color: #14B8A6;
    box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15);
  }
  #searchBtn {
    padding: 16px 28px;
    font-size: 15px;
    background: linear-gradient(135deg, #14B8A6, #0F766E);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(20, 184, 166, 0.4);
    white-space: nowrap;
  }
  #searchBtn:active { transform: scale(0.96); }
  #results { min-height: 80px; }
  .result-title {
    color: #0F766E;
    font-size: 13px;
    margin-bottom: 14px;
    font-weight: 700;
    padding: 8px 12px;
    background: #F0FDFA;
    border-radius: 10px;
    border-right: 4px solid #14B8A6;
  }
  .words-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .word-item {
    background: linear-gradient(135deg, #F0FDFA, #CCFBF1);
    color: #0F766E;
    padding: 9px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #99F6E4;
  }
  .no-result {
    text-align: center;
    color: #94A3B8;
    padding: 30px 20px;
    font-size: 14px;
    background: #F8FAF9;
    border-radius: 16px;
    border: 2px dashed #E2E8E6;
  }
  #status {
    text-align: center;
    color: #94A3B8;
    font-size: 11px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #F1F5F4;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 قافیه‌یاب فارسی</h1>
  <p class="subtitle">یه کلمه بنویس، قافیه‌هاشو ببین</p>
  
  <div class="tabs">
    <button class="tab active" data-mode="rhyme">هم‌قافیه</button>
    <button class="tab" data-mode="weight">هم‌وزن</button>
  </div>
  
  <div class="input-box">
    <input type="text" id="wordInput" placeholder="مثلاً: دل" autocomplete="off">
    <button id="searchBtn">بگرد</button>
  </div>
  
  <div id="results"></div>
  <div id="status">در حال بارگذاری...</div>
</div>

<script>
var wordList = [];
var currentMode = 'rhyme';

function cleanWord(w) {
  return w.replace(/\r/g, '').replace(/\n/g, '').replace(/\u200c/g, '').replace(/^\s+|\s+$/g, '');
}

// ============ شمارش هجا (دقیق) ============
// قاعده: هر مصوت بلند = 1 هجا
//        هر ترکیب صامت+صامت (بدون مصوت بینشون) = 1 هجا
function countSyllables(word) {
  if (!word) return 0;
  
  var vowels = ['ا','آ','و','ی'];
  var count = 0;
  var i = 0;
  
  while (i < word.length) {
    var ch = word[i];
    
    // اگه مصوت بلند بود → ۱ هجا
    if (vowels.indexOf(ch) !== -1) {
      count++;
      i++;
      continue;
    }
    
    // صامت: ببین بعدش چیه
    if (i + 1 < word.length) {
      var next = word[i + 1];
      
      // اگه بعدی مصوت بود → این ترکیب ۱ هجا (صامت + مصوت)
      if (vowels.indexOf(next) !== -1) {
        count++;
        i += 2;
        continue;
      }
      
      // اگه بعدی صامت بود → ۱ هجا (صامت + مصوت کوتاه + صامت)
      count++;
      i += 2;
      continue;
    }
    
    // آخرین حرف صامت تنها
    count++;
    i++;
  }
  
  return count || 1;
}

// ============ استخراج «آخرین هجا» ============
// یعنی از آخرین مصوت به بعد + صامت قبلش
function getLastSyllable(word) {
  if (word.length === 0) return "";
  if (word.length === 1) return word;
  
  var vowels = ['ا','آ','و','ی'];
  
  // آخرین مصوت رو پیدا کن
  var lastVowelIdx = -1;
  for (var i = word.length - 1; i >= 0; i--) {
    if (vowels.indexOf(word[i]) !== -1) {
      lastVowelIdx = i;
      break;
    }
  }
  
  // اگه مصوت نداشت → آخرین ۲ حرف
  if (lastVowelIdx === -1) {
    return word.length <= 2 ? word : word.slice(-2);
  }
  
  // اگه مصوت آخرین حرف بود → از مصوت تا آخر + ۱ حرف قبلش
  if (lastVowelIdx === word.length - 1) {
    if (lastVowelIdx >= 1) {
      return word.substring(lastVowelIdx - 1);
    }
    return word.substring(lastVowelIdx);
  }
  
  // از ۱ حرف قبل مصوت تا آخر
  if (lastVowelIdx >= 1) {
    return word.substring(lastVowelIdx - 1);
  }
  
  return word.substring(lastVowelIdx);
}

// ============ قافیه دقیق ============
function isRhyme(w1, w2) {
  if (w1 === w2) return false;
  
  // شرط ۱: آخرین هجا یکسان
  var s1 = getLastSyllable(w1);
  var s2 = getLastSyllable(w2);
  if (s1 !== s2) return false;
  
  // شرط ۲: تعداد هجا یکسان
  if (countSyllables(w1) !== countSyllables(w2)) return false;
  
  return true;
}

// ============ هموزن ============
function isSameWeight(w1, w2) {
  if (w1 === w2) return false;
  
  // شرط ۱: قافیه
  if (!isRhyme(w1, w2)) return false;
  
  // شرط ۲: طول کلمه یکسان (دقیق)
  if (w1.length !== w2.length) return false;
  
  return true;
}

// ============ پیدا کردن قافیه ============
function findRhymes(word) {
  var matches = [];
  var seen = {};
  
  for (var i = 0; i < wordList.length; i++) {
    var w = wordList[i];
    if (w === word) continue;
    if (seen[w]) continue;
    
    var match = false;
    if (currentMode === 'rhyme') {
      match = isRhyme(word, w);
    } else {
      match = isSameWeight(word, w);
    }
    
    if (match) {
      matches.push(w);
      seen[w] = true;
    }
  }
  
  matches.sort(function(a, b) { return a.localeCompare(b, 'fa'); });
  return matches;
}

// ============ نمایش ============
function showResults(word, matches) {
  var results = document.getElementById('results');
  if (matches.length === 0) {
    results.innerHTML = '<div class="no-result">قافیه‌ای پیدا نشد 😔</div>';
    return;
  }
  var modeName = currentMode === 'rhyme' ? 'هم‌قافیه' : 'هم‌وزن';
  var html = '<div class="result-title">' + matches.length + ' ' + modeName + ' برای «' + word + '»</div>';
  html += '<div class="words-list">';
  for (var i = 0; i < matches.length; i++) {
    html += '<span class="word-item">' + matches[i] + '</span>';
  }
  html += '</div>';
  results.innerHTML = html;
}

// ============ بارگذاری ============
function loadWords() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'words.txt?_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200 || xhr.status === 0) {
        var lines = xhr.responseText.split('\n');
        wordList = [];
        for (var i = 0; i < lines.length; i++) {
          var w = cleanWord(lines[i]);
          if (w.length > 0) wordList.push(w);
        }
        document.getElementById('status').textContent = '✅ ' + wordList.length + ' کلمه آماده';
      } else {
        document.getElementById('status').textContent = '❌ خطا: ' + xhr.status;
      }
    }
  };
  xhr.send();
}

// ============ رویدادها ============
var tabs = document.querySelectorAll('.tab');
for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener('click', function() {
    for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
    this.classList.add('active');
    currentMode = this.getAttribute('data-mode');
    document.getElementById('results').innerHTML = '';
  });
}

document.getElementById('searchBtn').addEventListener('click', function() {
  var word = cleanWord(document.getElementById('wordInput').value);
  if (!word) {
    document.getElementById('results').innerHTML = '<div class="no-result">یه کلمه بنویس اول 🙂</div>';
    return;
  }
  showResults(word, findRhymes(word));
});

document.getElementById('wordInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

loadWords();
</script>
</body>
</html>
