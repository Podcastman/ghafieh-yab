<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قافیه‌یاب فارسی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    padding: 30px 20px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 24px; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
  .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
  #wordInput {
    flex: 1;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-family: inherit;
    outline: none;
  }
  #wordInput:focus { border-color: #667eea; }
  #searchBtn {
    padding: 14px 24px;
    font-size: 16px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
  }
  #searchBtn:active { background: #5568d3; }
  #results { min-height: 100px; }
  .result-title { color: #667eea; font-size: 14px; margin-bottom: 12px; font-weight: bold; }
  .words-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .word-item {
    background: #f0f4ff;
    color: #444;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 15px;
    border: 1px solid #d8e0ff;
  }
  .no-result { text-align: center; color: #999; padding: 20px; font-size: 14px; }
  #status { text-align: center; color: #888; font-size: 12px; margin-top: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 قافیه‌یاب فارسی</h1>
  <p class="subtitle">قافیه‌های هم‌وزن برای کلمه‌ات</p>
  <div class="input-box">
    <input type="text" id="wordInput" placeholder="مثلاً: دل" autocomplete="off">
    <button id="searchBtn">بگرد</button>
  </div>
  <div id="results"></div>
  <div id="status">در حال بارگذاری...</div>
</div>

<script>
// ============ متغیرها ============
var wordList = [];

// ============ تابع: پاکسازی کلمه ============
function cleanWord(w) {
  return w
    .replace(/\r/g, '')
    .replace(/\n/g, '')
    .replace(/\u200c/g, '')
    .replace(/^\s+|\s+$/g, '');
}

// ============ تابع: آخرین ۲ حرف ============
function lastTwo(word) {
  if (word.length < 2) return word;
  return word.substring(word.length - 2);
}

// ============ تابع: شمارش هجا (تقریبی) ============
function countSyllables(word) {
  var count = 0;
  for (var i = 0; i < word.length; i++) {
    var ch = word[i];
    if (ch === 'ا' || ch === 'آ' || ch === 'و' || ch === 'ی') {
      count++;
    }
  }
  if (count === 0) count = 1;
  return count;
}

// ============ تابع: بررسی قافیه ============
function isRhyme(w1, w2) {
  if (w1 === w2) return false;
  
  // شرط ۱: آخرین ۲ حرف یکسان
  if (lastTwo(w1) !== lastTwo(w2)) return false;
  
  // شرط ۲: طول کلمه اختلاف حداکثر ۱ حرف
  if (Math.abs(w1.length - w2.length) > 1) return false;
  
  return true;
}

// ============ تابع: پیدا کردن قافیه ============
function findRhymes(word) {
  var matches = [];
  for (var i = 0; i < wordList.length; i++) {
    if (isRhyme(word, wordList[i])) {
      matches.push(wordList[i]);
    }
  }
  return matches;
}

// ============ تابع: نمایش نتایج ============
function showResults(word, matches) {
  var results = document.getElementById('results');
  if (matches.length === 0) {
    results.innerHTML = '<div class="no-result">قافیه‌ای پیدا نشد 😔</div>';
    return;
  }
  var html = '<div class="result-title">' + matches.length + ' قافیه برای «' + word + '»:</div>';
  html += '<div class="words-list">';
  for (var i = 0; i < matches.length; i++) {
    html += '<span class="word-item">' + matches[i] + '</span>';
  }
  html += '</div>';
  results.innerHTML = html;
}

// ============ بارگذاری کلمات ============
function loadWords() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'words.txt?_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200 || xhr.status === 0) {
        var lines = xhr.responseText.split('\n');
        wordList = [];
        for (var i = 0; i < lines.length; i++) {
          var w = cleanWord(lines[i]);
          if (w.length > 0) wordList.push(w);
        }
        document.getElementById('status').textContent = '✅ ' + wordList.length + ' کلمه آماده';
      } else {
        document.getElementById('status').textContent = '❌ خطا: ' + xhr.status;
      }
    }
  };
  xhr.onerror = function() {
    document.getElementById('status').textContent = '❌ خطای شبکه';
  };
  xhr.send();
}

// ============ رویدادها ============
document.getElementById('searchBtn').addEventListener('click', function() {
  var word = cleanWord(document.getElementById('wordInput').value);
  if (!word) {
    document.getElementById('results').innerHTML = '<div class="no-result">یه کلمه بنویس اول 🙂</div>';
    return;
  }
  var matches = findRhymes(word);
  showResults(word, matches);
});

document.getElementById('wordInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

// ============ شروع ============
loadWords();
</script>
</body>
</html>
